[project]
name = "medvolt_protein_engineering"
version = "0.1.0"
# Python 3.10 is not supported: see the note in requirements.txt (scipy wheels
# for 3.10 fail to load on macOS 26+, and the fix requires Python >= 3.11).
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, naming, bugbear, pyupgrade, simplify, docstrings, numpy, pandas
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "D", "NPY", "PD"]
ignore = [
    "D105",   # magic-method docstrings
    "D107",   # __init__ docstrings (documented on the class)
]

[tool.ruff.lint.per-file-ignores]
# The notebook must put the project root on sys.path before it can import src,
# so its first-party imports cannot come first in the cell.
"notebooks/*.ipynb" = ["E402"]
# FastAPI's dependency injection is declared as a call in an argument default
# (`service: ModelService = Depends(get_service)`). That is the framework's
# documented idiom, not the mutable-default bug B008 exists to catch.
# N815: `ddG` is the standard rendering of the free-energy change dG, and is
# how the column is spelled in the dataset and every artifact. Lowercasing it
# to `ddg` to satisfy a naming rule would make the field harder to join against
# the CSVs and would read wrongly to the scientific audience.
"src/api.py" = ["B008", "N815"]
# The test module imports TestClient after importorskip, which must run first.
"tests/test_api.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
