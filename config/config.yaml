# =============================================================================
# Medvolt.AI — Protein Mutation-Effect Prediction & Candidate Prioritization
#
# Run configuration: environment setup and scientific / modelling DECISIONS only.
# Fixed facts about the dataset (column names, categorical codes, value ranges,
# naming conventions) live in src/common/constants.py.
# Rule of thumb: if a reviewer could reasonably ask "why this value?" for a given
# run, it belongs here. See docs/CODING_GUIDELINES.md, section 4.
#
# Relative paths resolve against the project root (the folder holding main.py).
# =============================================================================

project:
  name: medvolt_protein_engineering
  random_seed: 20261102          # Dataset-mandated seed (README_DATASET.txt)

# -----------------------------------------------------------------------------
# File system
# -----------------------------------------------------------------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  # Deliverable layout: results/ holds everything a reviewer reads, split by kind.
  models_dir: results/models                  # fitted pipelines + provenance
  metrics_dir: results/metrics                # CV metrics, OOF predictions, ablation
  figures_dir: results/figures                # evaluation plots
  rankings_dir: results/mutation_rankings     # scored candidates and the Top-K table

files:
  labeled: labeled_mutations.csv
  candidates: candidate_mutations_unlabeled.csv
  embeddings: protein_embeddings.csv
  # processed_dir
  processed_train: processed_train.parquet           # .parquet | .csv
  processed_candidates: processed_candidates.parquet
  feature_manifest: feature_manifest.json           # feature lists + data-quality report
  # metrics_dir
  cv_fold_summary: cv_fold_summary.csv              # per-fold sizes, group counts, leakage
  oof_predictions: oof_predictions.parquet          # every out-of-fold prediction (long format)
  cv_fold_metrics: cv_fold_metrics.csv              # metrics per strategy x model x target x fold
  cv_metrics_summary: cv_metrics_summary.csv        # pooled OOF + fold mean/std metrics
  model_selection: model_selection.json             # chosen model per target and why
  evaluation_markdown: evaluation_summary.md        # headline metrics + optimism gap
  evaluation_json: evaluation_summary.json          # same report, machine-readable
  model_comparison: model_comparison.csv            # every model family x target x strategy
  baseline_benchmark: baseline_benchmark.csv        # every model x target x strategy
  baseline_benchmark_markdown: baseline_benchmark.md  # same, for the technical report
  torch_oof_predictions: torch_oof_predictions.parquet  # neural-net out-of-fold predictions
  torch_cv_metrics: torch_cv_metrics.csv            # neural-net pooled + per-fold metrics
  torch_history: torch_training_history.csv         # loss per fold x epoch
  torch_fold_summary: torch_fold_summary.csv        # early-stopping epoch per fold
  torch_comparison: torch_vs_baselines.csv          # neural net against the sklearn baselines
  torch_comparison_markdown: torch_vs_baselines.md  # same, for the technical report
  torch_v2_oof_predictions: torch_v2_oof_predictions.parquet  # dual-branch OOF predictions
  torch_v2_cv_metrics: torch_v2_cv_metrics.csv      # dual-branch pooled + per-fold metrics
  torch_v2_history: torch_v2_training_history.csv   # loss per fold x epoch
  torch_v2_fold_summary: torch_v2_fold_summary.csv  # early-stopping epoch per fold
  torch_v2_comparison: torch_v2_vs_baselines.csv    # dual-branch against every other model
  torch_v2_comparison_markdown: torch_v2_vs_baselines.md  # same, for the technical report
  feature_importances: feature_importances.csv      # per-feature attribution, averaged over folds
  feature_group_importances: feature_group_importances.csv  # the same, summed per feature group
  attribution_markdown: feature_attribution.md      # attribution write-up for the report
  ablation_summary: ablation_summary.csv            # feature-subset ablation metrics
  ablation_summary_markdown: ablation_summary.md    # same, for the technical report
  # models_dir
  training_metadata: training_metadata.json         # provenance for saved models
  # figures_dir
  fig_pred_vs_actual: pred_vs_actual.png            # out-of-fold predictions vs ground truth
  fig_residuals: residual_distribution.png          # residual histogram per target
  fig_strategy_comparison: strategy_comparison.png  # selection metric by CV strategy
  fig_torch_learning_curves: torch_learning_curves.png  # train/inner-val loss per fold x epoch
  fig_model_comparison: model_comparison.png        # every metric, baselines vs the neural net
  fig_baseline_vs_torch: baseline_vs_nn_fit.png     # fit and residuals, best baseline vs the net
  fig_torch_v2_learning_curves: torch_v2_learning_curves.png  # dual-branch loss per fold x epoch
  fig_model_comparison_v2: model_comparison_v2.png  # every metric, all models incl. dual-branch
  fig_baseline_vs_torch_v2: baseline_vs_dual_branch_fit.png  # fit and residuals vs the baseline
  fig_ablation_drop: ablation_performance_drop.png  # metric change when a feature group is cut
  fig_feature_importance: feature_importance.png    # top features by permutation importance
  fig_group_importance: feature_group_importance.png  # importance summed by feature group
  # rankings_dir
  top_candidates: top_10_candidates.csv             # Top-K prioritization table
  top_candidates_markdown: top_10_candidates.md     # same table for the technical report
  all_predictions: candidate_predictions.csv        # all candidates, scored and flagged
  interpretation_markdown: candidate_interpretation.md  # per-candidate scientific breakdown

# -----------------------------------------------------------------------------
# Feature engineering decisions
# -----------------------------------------------------------------------------
features:
  secondary_structure_encoding: onehot   # onehot | ordinal
  add_abs_deltas: true                   # add |Δ| alongside signed Δ
  add_relative_position: true            # position / protein_length
  embedding_reduction:
    enabled: true
    method: pca                          # fit inside each CV fold (no leakage)
    n_components: 16

# -----------------------------------------------------------------------------
# Data-quality policy
# -----------------------------------------------------------------------------
quality:
  numeric_imputation: median             # median | mean; fit on labeled data only
  replace_inf_with_nan: true
  drop_rows_with_missing_target: true    # targets are never imputed
  fail_on_row_loss_in_merge: true
  fail_on_duplicate_ids: true

# -----------------------------------------------------------------------------
# Validation
# -----------------------------------------------------------------------------
validation:
  strategies: [random, protein_group, family_group]   # any subset of these three
  primary_strategy: family_group         # most realistic proxy for OOD candidates
  n_splits: 5                            # >= 2 and <= number of groups (7 families in training)
  shuffle: true                          # shuffle rows/groups before folding (seeded)
  metrics: [rmse, mae, r2, pearson, spearman]   # any subset of these five

# -----------------------------------------------------------------------------
# Models
# All preprocessing below (imputation, scaling, embedding PCA) is fit inside
# each training fold as part of one sklearn Pipeline; nothing sees validation data.
# -----------------------------------------------------------------------------
models:
  scaler: standard                       # standard | robust | none
  # One model per target is trained for every candidate listed here.
  # Available: ridge | random_forest | gradient_boosting (sklearn gradient-boosted trees)
  candidates:
    ridge:
      alpha: 1.0
    random_forest:
      n_estimators: 500
      max_depth: null
      min_samples_leaf: 3
      max_features: 0.3
      n_jobs: -1
    gradient_boosting:
      n_estimators: 400
      learning_rate: 0.03
      max_depth: 3
      subsample: 0.8
  # Best model per target = best pooled out-of-fold value of this metric under
  # validation.primary_strategy. Spearman because Phase 4 ranks candidates.
  selection_metric: spearman             # must be one of validation.metrics
  refit_on_full_data: true               # refit selected models on all labeled data for Phase 4
  save_fold_pipelines: true              # save the selected model's primary-strategy fold pipelines
                                         # (fold ensemble for prediction uncertainty in Phase 4)

# -----------------------------------------------------------------------------
# PyTorch multitask neural network (src/torch_model.py, src/train_torch.py)
# One shared backbone feeding two regression heads, trained on both targets at
# once. Runs on the same folds as the sklearn baselines, with the same
# fold-local preprocessing, so its metrics are directly comparable.
# -----------------------------------------------------------------------------
torch:
  # Shared backbone: one hidden layer per entry, each Linear -> BatchNorm ->
  # activation -> Dropout. Widths taper so the backbone compresses toward the heads.
  hidden_dims: [256, 128, 64]
  activation: relu                     # relu | gelu
  batch_norm: true
  dropout: 0.25
  # Per-head hidden width; null makes a head a single Linear layer.
  head_hidden_dim: 32
  optimizer:
    learning_rate: 0.001
    weight_decay: 0.0001               # L2, applied by Adam
  batch_size: 64
  max_epochs: 300
  # Early stopping watches an inner split carved out of the TRAINING fold only.
  # The outer validation fold is never seen during fitting, so out-of-fold
  # metrics stay honest; see docstring in src/train_torch.py.
  early_stopping:
    inner_val_fraction: 0.2
    patience: 25
    min_delta: 0.0001
  # Joint objective: alpha * MSE(stability) + beta * MSE(function).
  # Rescaled to sum to 1, like prioritization.weights.
  loss_weights:
    stability: 0.5
    function: 0.5
  # stability_ddG is standardized on the training fold (kcal/mol, unbounded);
  # functional_score is left on its native 0-1 scale and produced by a sigmoid head.
  standardize_stability_target: true
  # auto resolves to cpu: MPS/CUDA kernels are not bit-reproducible.
  device: auto                         # auto | cpu | mps | cuda
  save_fold_models: true

# -----------------------------------------------------------------------------
# Dual-branch network (src/torch_model_v2.py, src/train_torch_v2.py)
# Same folds, same leakage rules, different architecture: the tabular block and
# the embedding block travel down separate branches and meet at a fusion trunk.
# -----------------------------------------------------------------------------
torch_v2:
  # Branch 1: localized physicochemical deltas, conservation, accessibility,
  # secondary structure. These carry the mutation-specific signal.
  tabular_branch:
    hidden_dims: [128, 64]
  # Branch 2: the 256-d protein embedding, squeezed through a learned
  # bottleneck. The ablation shows embeddings alone score a NEGATIVE rank
  # correlation under family-grouped CV, so the branch's job is to pass through
  # the little that generalises and discard the family-identity signal.
  embedding_branch:
    bottleneck_dim: 32
    hidden_dims: [64]
  # Replace the fold-local PCA with the learned bottleneck above. Set true to
  # keep PCA as well, which stacks two reductions and is rarely what you want.
  embedding_pca: false
  # Fusion trunk: concatenated branches -> residual blocks -> heads.
  fusion:
    hidden_dim: 128
    n_residual_blocks: 2
  head_hidden_dim: 32
  activation: relu                     # relu | gelu
  batch_norm: true
  dropout: 0.3
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.0001
  batch_size: 32
  max_epochs: 300
  early_stopping:
    inner_val_fraction: 0.2
    patience: 25
    min_delta: 0.0001
  # v1 weighted the two tasks equally, which let the unbounded stability target
  # dominate: functional_score lives on 0-1, so its MSE is ~30x smaller and
  # contributes almost nothing to the gradient. Weighting the function task up
  # is the correction; see report/final_report_full.md.
  loss_weights:
    stability: 0.3
    function: 0.7
  standardize_stability_target: true
  device: auto
  save_fold_models: true

# -----------------------------------------------------------------------------
# HTTP service (src/api.py)
# Serves the ALREADY-TRAINED model. Training stays a command-line pipeline:
# a request that blocks for minutes and mutates shared artifacts is not an API.
# -----------------------------------------------------------------------------
api:
  host: 127.0.0.1                        # 0.0.0.0 to accept off-box traffic
  port: 8000
  title: Protein Mutation Effect API
  # Reject oversized batches rather than letting one request monopolise the
  # process; the model is loaded once and shared, so there is no parallelism.
  max_batch_size: 500
  # Browser origins allowed to call the API. Empty = none, which is correct
  # for Postman and curl; add origins only when a web front end needs them.
  cors_allow_origins: []
  # Serve the generated PNGs over HTTP. Off by default: the figures directory
  # is not a public asset store.
  serve_figures: true

# -----------------------------------------------------------------------------
# Feature attribution (src/attribution.py, assignment Task 7)
# Explains the SELECTED model: which inputs it actually used, measured on
# held-out fold rows rather than on the rows it was fitted to.
# -----------------------------------------------------------------------------
attribution:
  # permutation = shuffle a column on the fold's validation rows and measure
  # the loss of skill (honest, model-agnostic, defined on ORIGINAL columns).
  # impurity = the tree ensemble's internal split gains (training-set based,
  # biased toward high-cardinality features, and defined on POST-PCA inputs).
  kinds: [permutation, impurity]
  # Metric degraded by the shuffle. Spearman matches how candidates are ranked.
  scoring_metric: spearman
  # Shuffles per feature per fold. Higher is less noisy and linearly slower.
  n_repeats: 5
  # Permuting all 256 embedding columns one at a time is slow and says little:
  # they are a protein-level block, so they are shuffled together as one unit.
  group_embeddings_as_block: true
  top_k: 20                            # features drawn in the per-feature figure

# -----------------------------------------------------------------------------
# Evaluation and visual quality control (src/evaluate.py)
# Reads the artifacts src/train.py wrote; nothing is refit here.
# -----------------------------------------------------------------------------
evaluation:
  # Strategy the headline table and figures report; null = validation.primary_strategy.
  strategy: null
  figures: true                          # write the figures listed under `files` to figures_dir
  figure_dpi: 150                        # 50-600; 150 keeps the report readable without bloat

# -----------------------------------------------------------------------------
# Ablation study (Phase 5)
# Each subset names feature groups defined in src/common/constants.py
# (FEATURE_GROUPS). Columns absent from the Phase 1 manifest are skipped, so a
# subset naming `deltas` is empty if delta features were disabled upstream.
# -----------------------------------------------------------------------------
ablation:
  # Run under this CV strategy; null = validation.primary_strategy.
  strategy: null
  # null = the model Phase 3 selected for each target; else a models.candidates key.
  model: null
  baseline: D_full                       # subset the deltas are measured against
  subsets:
    A_tabular_no_embeddings: [physicochemical, sequence]
    B_embeddings_only: [embeddings]
    C_tabular_plus_embeddings: [physicochemical, sequence, embeddings]
    D_full: [physicochemical, sequence, structural, deltas, embeddings]
    # Leave-one-group-out arms that isolate each source's marginal contribution.
    E_all_tabular_no_embeddings: [physicochemical, sequence, structural, deltas]
    F_full_minus_deltas: [physicochemical, sequence, structural, embeddings]
    G_full_minus_structural: [physicochemical, sequence, deltas, embeddings]

# -----------------------------------------------------------------------------
# Scientific interpretation (Phase 5)
# -----------------------------------------------------------------------------
interpretation:
  n_candidates: 4                        # how many of the Top K to write up in detail
  # Feature values quoted per candidate, alongside predictions and uncertainty.
  report_features:
    - conservation_score
    - solvent_accessibility
    - distance_to_active_site
    - local_confidence_score
    - delta_hydrophobicity
    - delta_charge
    - delta_volume

# -----------------------------------------------------------------------------
# Candidate prioritization
# -----------------------------------------------------------------------------
prioritization:
  top_k: 10
  # Point estimate per candidate: mean over the CV fold pipelines (whose spread
  # gives the uncertainty), or the single model refit on all labeled data.
  point_estimate: ensemble_mean          # ensemble_mean | final_model
  min_fold_models: 2                     # fewer fold models than this cannot give a spread
  # Objectives are normalized within the candidate pool before weighting, so
  # scores are relative to this pool and not absolute merit.
  score_normalization: rank              # rank | minmax
  weights:
    stability: 0.5                       # applied to -ddG (stabilizing = better)
    function: 0.5                        # applied to functional_score (higher = better)
  # Weights are rescaled to sum to 1. Penalty is applied to the normalized
  # combined uncertainty, so it is on the same 0-1 scale as the objectives.
  uncertainty_penalty: 0.25
  ood_flag_unseen_family: true           # flag candidates from families absent in training
  # Multi-objective viability gate: a candidate is viable only if it is
  # predicted to stabilize AND to retain function. On the current candidate
  # pool only 5 of 180 clear the stability gate, so excluding non-viable
  # candidates outright would return a Top 5, not a Top 10.
  viability:
    enabled: true
    max_stability_ddG: 0.0               # ddG at or below this counts as stabilizing
    min_functional_score: 0.7            # retention at or above this counts as functional
    # false: rank viable candidates above the rest but still report top_k rows,
    #        so the shortlist stays the requested length and the gate is visible.
    # true:  drop non-viable candidates entirely, which may return fewer rows.
    exclude_non_viable: false

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: INFO                            # DEBUG | INFO | WARNING | ERROR
